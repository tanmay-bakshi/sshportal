name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  windows-cross:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install cross-compilation tools
        run: |
          brew install llvm lld jq
          rustup toolchain install 1.91.0 \
            --profile minimal \
            --target x86_64-pc-windows-msvc
          cargo install --locked --version 0.21.4 cargo-xwin
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/cargo-xwin
          key: cargo-xwin-${{ runner.os }}-${{ runner.arch }}-0.21.4
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-cross-x86_64-msvc
      - run: tools/build_windows_release.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.91.0
      - if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      - if: matrix.os != 'windows-latest'
        uses: Swatinem/rust-cache@v2
      - if: matrix.os != 'windows-latest'
        run: cargo test --locked --all-targets
      - if: matrix.os == 'windows-latest'
        run: cargo test --locked platform::tests -- --nocapture
      - if: matrix.os == 'windows-latest'
        run: cargo test --locked keys::tests -- --nocapture
      - if: matrix.os == 'windows-latest'
        run: cargo test --locked control::tests -- --nocapture
      - if: matrix.os == 'windows-latest'
        run: cargo test --locked socks::tests -- --nocapture
      - if: matrix.os == 'windows-latest'
        run: cargo test --locked websocket::tests -- --nocapture
      - if: matrix.os == 'windows-latest'
        timeout-minutes: 5
        run: "cargo test --locked network:: -- --nocapture"
      - if: matrix.os == 'windows-latest'
        timeout-minutes: 5
        run: "cargo test --locked vpn::packet:: -- --nocapture"
      - if: matrix.os == 'windows-latest'
        timeout-minutes: 5
        run: "cargo test --locked vpn::dns:: -- --nocapture"
      - if: matrix.os == 'windows-latest'
        run: cargo test --locked vpn::routes::tests -- --nocapture
      - if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $featureTree = cargo tree --locked `
            --target x86_64-pc-windows-msvc `
            --edges features `
            --invert wintun-bindings
          $featureTree
          if ($featureTree -match 'verify_binary_signature') {
              throw "wintun-bindings/verify_binary_signature executes the DLL before verification"
          }

          New-Item -ItemType Directory -Force target/windows-fixtures | Out-Null
          cl /LD /nologo tests/fixtures/rejected_wintun.c `
            /Fo:target/windows-fixtures/rejected-wintun.obj `
            /link `
            /IMPLIB:target/windows-fixtures/rejected-wintun.lib `
            /OUT:target/windows-fixtures/rejected-wintun.dll
          if ($LASTEXITCODE -ne 0) {
              throw "failed to compile the rejected Wintun fixture"
          }
          $env:SSHPORTAL_REJECTED_WINTUN_DLL = `
            (Resolve-Path target/windows-fixtures/rejected-wintun.dll).Path
          $env:SSHPORTAL_REJECTED_WINTUN_MARKER = `
            (Join-Path (Resolve-Path target/windows-fixtures).Path "dllmain-marker")
          $metadata = cargo metadata --locked `
            --format-version 1 `
            --filter-platform x86_64-pc-windows-msvc | ConvertFrom-Json
          $wintunPackages = @(
              $metadata.packages | Where-Object { $_.name -eq "wintun-bindings" }
          )
          if ($wintunPackages.Count -ne 1) {
              throw "expected exactly one wintun-bindings package"
          }
          $wintunRoot = Split-Path $wintunPackages[0].manifest_path
          $env:SSHPORTAL_TRUSTED_WINTUN_DLL = `
            (Resolve-Path "$wintunRoot/wintun/bin/amd64/wintun.dll").Path
          cargo test --locked `
            --manifest-path crates/wintun-security/Cargo.toml `
            -- --nocapture
      - if: matrix.os == 'windows-latest'
        run: cargo test --locked --bin sshportal-client -- --nocapture
      - if: matrix.os == 'windows-latest'
        run: cargo test --locked --bin sshportal-server -- --nocapture
      - if: matrix.os == 'windows-latest'
        timeout-minutes: 3
        run: cargo test --locked shell::tests::negotiates_socks5_domain_connect_request -- --nocapture
      - if: matrix.os == 'windows-latest'
        timeout-minutes: 3
        run: cargo test --locked shell::tests::rejects_unsupported_socks5_command -- --nocapture
      - if: matrix.os == 'windows-latest'
        timeout-minutes: 3
        run: cargo test --locked shell::tests::forwards_direct_tcpip_channels_to_client_network -- --nocapture
      - if: matrix.os == 'windows-latest'
        timeout-minutes: 3
        run: cargo test --locked shell::tests::runs_authenticated_transport_over_websocket_io -- --nocapture
      - if: matrix.os == 'windows-latest'
        timeout-minutes: 3
        run: cargo test --locked shell::tests::dynamic_forward_listener_routes_socks_connections_through_client_network -- --nocapture
      - if: matrix.os == 'windows-latest'
        timeout-minutes: 3
        run: cargo test --locked shell::tests::executes_noninteractive_commands_over_authenticated_transport -- --nocapture
      - if: matrix.os == 'windows-latest'
        timeout-minutes: 3
        run: cargo test --locked shell::tests::reuses_authenticated_transport_for_multiple_shell_sessions -- --nocapture
      - if: matrix.os == 'windows-latest'
        timeout-minutes: 3
        run: cargo test --locked shell::tests::local_ssh_proxy_executes_noninteractive_commands -- --nocapture
      - if: matrix.os == 'windows-latest'
        timeout-minutes: 3
        run: cargo test --locked shell::tests::local_ssh_proxy_accepts_repeated_sessions_over_one_client_transport -- --nocapture

  native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify generated Xcode project
        run: |
          gem install xcodeproj --version 1.27.0 --no-document
          ruby macos/Support/generate_project.rb
          git diff --exit-code -- macos/SSHPortal.xcodeproj
      - name: Test native per-app VPN targets
        run: |
          xcodebuild \
            -project macos/SSHPortal.xcodeproj \
            -scheme SSHPortal \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath target/macos-ci-derived \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Build universal companion and system extension
        run: |
          xcodebuild \
            -project macos/SSHPortal.xcodeproj \
            -scheme SSHPortal \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath target/macos-ci-universal-derived \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            build
          lipo \
            target/macos-ci-universal-derived/Build/Products/Release/SSHPortal.app/Contents/MacOS/SSHPortal \
            -verify_arch arm64
          lipo \
            target/macos-ci-universal-derived/Build/Products/Release/SSHPortal.app/Contents/MacOS/SSHPortal \
            -verify_arch x86_64
          lipo \
            target/macos-ci-universal-derived/Build/Products/Release/SSHPortal.app/Contents/Library/SystemExtensions/SSHPortalAppProxy.systemextension/Contents/MacOS/SSHPortalAppProxy \
            -verify_arch arm64
          lipo \
            target/macos-ci-universal-derived/Build/Products/Release/SSHPortal.app/Contents/Library/SystemExtensions/SSHPortalAppProxy.systemextension/Contents/MacOS/SSHPortalAppProxy \
            -verify_arch x86_64

  e2e-macos-system-vpn:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Verify passwordless administrative access
        run: sudo -n true
      - name: Test native macOS system VPN data plane
        run: python3 tools/macos_vpn_e2e.py

  e2e-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools openssl
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: python3 tools/docker_e2e.py
      - run: python3 tools/docker_vpn_e2e.py --skip-build
