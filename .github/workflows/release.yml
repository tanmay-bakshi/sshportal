name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_tag:
    runs-on: ubuntu-24.04
    outputs:
      release_kind: ${{ steps.validate.outputs.release_kind }}
      release_version: ${{ steps.validate.outputs.release_version }}
    steps:
      - uses: actions/checkout@v5
      - id: validate
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "${TAG_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            release_kind="full"
            release_version="${BASH_REMATCH[1]}"
          elif [[ "${TAG_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-windows-x86_64$ ]]; then
            release_kind="windows"
            release_version="${BASH_REMATCH[1]}"
          else
            echo "Unsupported release tag ${TAG_NAME}." >&2
            echo "Use vX.Y.Z or vX.Y.Z-windows-x86_64." >&2
            exit 1
          fi

          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "sshportal") | .version'
          )"
          if [[ "${package_version}" != "${release_version}" ]]; then
            echo "Tag ${TAG_NAME} targets package version ${package_version}." >&2
            exit 1
          fi

          echo "release_kind=${release_kind}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"

  validate_source:
    needs: validate_tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets

  validate_macos_system_vpn:
    needs: validate_tag
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: "cargo test --locked vpn:: -- --nocapture"
      - run: sudo -n true
      - run: python3 tools/macos_vpn_e2e.py

  build_linux:
    needs:
      - validate_tag
      - validate_source
      - validate_macos_system_vpn
    if: needs.validate_tag.outputs.release_kind == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      TAG_NAME: ${{ github.ref_name }}
      RUST_TOOLCHAIN: 1.91.0
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes binutils file musl-tools

      - name: Install Rust target
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --target "${TARGET}"

      - name: Build static musl binaries
        run: cargo "+${RUST_TOOLCHAIN}" build --locked --release --target "${TARGET}" --bins

      - name: Verify static linkage
        run: |
          set -euo pipefail

          for binary in \
            "target/${TARGET}/release/sshportal-client" \
            "target/${TARGET}/release/sshportal-server"
          do
            file "${binary}"
            if readelf -l "${binary}" | grep -q "Requesting program interpreter"; then
              echo "${binary} has a dynamic program interpreter" >&2
              exit 1
            fi
            if readelf -d "${binary}" 2>/dev/null | grep -q "(NEEDED)"; then
              echo "${binary} has dynamic shared library dependencies" >&2
              exit 1
            fi
          done

      - name: Package release archive
        run: |
          set -euo pipefail

          archive_stem="sshportal-${TAG_NAME}-${TARGET}"
          package_dir="dist/${archive_stem}"
          mkdir -p "${package_dir}"

          install -m 0755 "target/${TARGET}/release/sshportal-client" "${package_dir}/sshportal-client"
          install -m 0755 "target/${TARGET}/release/sshportal-server" "${package_dir}/sshportal-server"
          install -m 0644 README.md LICENSE "${package_dir}/"

          tar -C dist -czf "dist/${archive_stem}.tar.gz" "${archive_stem}"
          (cd dist && sha256sum "${archive_stem}.tar.gz" > "${archive_stem}.tar.gz.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  build_windows:
    needs:
      - validate_tag
      - validate_source
      - validate_macos_system_vpn
    if: >-
      needs.validate_tag.outputs.release_kind == 'full' ||
      needs.validate_tag.outputs.release_kind == 'windows'
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
      TAG_NAME: ${{ github.ref_name }}
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.91.0

      - name: Verify Wintun loader feature selection
        shell: pwsh
        run: |
          $featureTree = cargo tree --locked `
            --target $env:TARGET `
            --edges features `
            --invert wintun-bindings
          $featureTree
          if ($featureTree -match 'verify_binary_signature') {
              throw "wintun-bindings/verify_binary_signature executes the DLL before verification"
          }

      - name: Build static-CRT Windows binaries
        run: cargo build --locked --release --target $env:TARGET --bins

      - name: Verify Windows binaries and signed Wintun driver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDirectory = "target/$env:TARGET/release"
          $wintunPath = "$releaseDirectory/wintun.dll"
          if (-not (Test-Path $wintunPath)) {
              throw "The tun build did not produce $wintunPath"
          }

          $checksumFields = (Get-Content tools/wintun-amd64.sha256 -Raw).Trim() -split "\s+"
          $expectedWintunHash = $checksumFields[0].ToLowerInvariant()
          if ($expectedWintunHash -notmatch "^[0-9a-f]{64}$") {
              throw "tools/wintun-amd64.sha256 does not contain a valid SHA-256"
          }
          $wintunHash = (Get-FileHash -Algorithm SHA256 $wintunPath).Hash.ToLowerInvariant()
          if ($wintunHash -ne $expectedWintunHash) {
              throw "wintun.dll has an unexpected SHA-256: $wintunHash"
          }

          $signature = Get-AuthenticodeSignature $wintunPath
          if ($signature.Status -ne "Valid") {
              throw "wintun.dll has an invalid Authenticode signature: $($signature.Status)"
          }
          $publisher = $signature.SignerCertificate.GetNameInfo(
              [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
              $false
          )
          if ($publisher -ne "WireGuard LLC") {
              throw "wintun.dll has an unexpected Authenticode publisher: $publisher"
          }

          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $dumpbin = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -find "VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" |
              Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($dumpbin)) {
              throw "Could not locate dumpbin.exe"
          }

          $allowedDependencies = [System.Collections.Generic.HashSet[string]]::new(
              [System.StringComparer]::OrdinalIgnoreCase
          )
          foreach ($dependency in Get-Content tools/windows-system-dlls.txt) {
              if ($dependency -notmatch "^[a-z0-9_.-]+\.dll$") {
                  throw "tools/windows-system-dlls.txt is malformed"
              }
              [void] $allowedDependencies.Add($dependency)
          }
          if ($allowedDependencies.Count -eq 0) {
              throw "tools/windows-system-dlls.txt is empty"
          }

          foreach ($binary in @("sshportal-client.exe", "sshportal-server.exe")) {
              $binaryPath = "$releaseDirectory/$binary"
              $dependencyOutput = & $dumpbin /dependents $binaryPath
              if ($LASTEXITCODE -ne 0) {
                  throw "dumpbin failed to inspect $binary"
              }
              $dependencies = $dependencyOutput -join "`n"
              $dependencies
              $dependencyNames = [regex]::Matches(
                  $dependencies,
                  "(?im)^\s+([a-z0-9_.-]+\.dll)\s*$"
              ) | ForEach-Object { $_.Groups[1].Value }
              if ($dependencyNames.Count -eq 0) {
                  throw "dumpbin found no readable imports for $binary"
              }
              foreach ($dependency in $dependencyNames) {
                  if (-not $allowedDependencies.Contains($dependency)) {
                      throw "$binary unexpectedly imports non-system DLL $dependency"
                  }
              }

              $loadConfigOutput = & $dumpbin /loadconfig $binaryPath
              if ($LASTEXITCODE -ne 0) {
                  throw "dumpbin failed to inspect the load configuration for $binary"
              }
              $loadConfig = $loadConfigOutput -join "`n"
              $loadConfig
              if ($loadConfig -notmatch "(?im)^\s+0*800\s+Dependent Load Flag(?:s)?\s*$") {
                  throw "$binary does not restrict static imports to System32"
              }
          }

      - name: Package Windows release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archiveStem = "sshportal-$env:TAG_NAME-$env:TARGET"
          $packageDirectory = "dist/$archiveStem"
          $releaseDirectory = "target/$env:TARGET/release"
          New-Item -ItemType Directory -Force $packageDirectory | Out-Null

          Copy-Item "$releaseDirectory/sshportal-client.exe" $packageDirectory
          Copy-Item "$releaseDirectory/sshportal-server.exe" $packageDirectory
          Copy-Item "$releaseDirectory/wintun.dll" $packageDirectory
          Copy-Item README.md, LICENSE $packageDirectory
          Copy-Item licenses/WINTUN.txt "$packageDirectory/WINTUN-LICENSE.txt"

          $archivePath = "dist/$archiveStem.zip"
          Compress-Archive -Path $packageDirectory -DestinationPath $archivePath
          $archive = Get-Item $archivePath
          $hash = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" |
              Set-Content -Encoding ascii "$archivePath.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: release-x86_64-pc-windows-msvc
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - validate_tag
      - validate_source
      - validate_macos_system_vpn
      - build_linux
      - build_windows
    if: >-
      always() &&
      needs.validate_tag.result == 'success' &&
      needs.validate_source.result == 'success' &&
      needs.validate_macos_system_vpn.result == 'success' &&
      needs.build_windows.result == 'success' &&
      (needs.validate_tag.outputs.release_kind == 'windows' ||
      needs.build_linux.result == 'success')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(dist/*.tar.gz dist/*.zip dist/*.sha256)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${assets[@]}" --clobber
            exit 0
          fi

          gh release create "${TAG_NAME}" "${assets[@]}" --verify-tag --title "${TAG_NAME}" --notes ""
